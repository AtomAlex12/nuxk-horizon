openapi: 3.1.0

info:
  title: nuxk-core agent API
  version: "1"
  description: >
    The contract between the nuxk-core agent (on the router, or the Pi test
    stand) and its clients: the lite web UI served by the agent itself and
    nuxk-controller on the Pi.

    Single-tenant. Every path except /healthz and /auth/* needs either
    `Authorization: Bearer <API_TOKEN>` (`/opt/etc/nuxk/nuxk.conf`; programs —
    the controller) or the `nuxk_agent` session cookie from POST /auth/login
    (a browser: the box's root login and password, as for SSH). A session's
    writes must come from the agent's own page (Origin is checked). A loopback
    caller is let in without either only when no token is configured.
    Responses are the resource itself; errors are `{"error":{"code","message"}}`
    plus the HTTP status. Request bodies are capped at 4 MiB.

    This file is checked against the agent's route table in CI
    (TestOpenAPIMatchesRoutes): an endpoint exists here if and only if the
    agent serves it. Planned endpoints are not listed until they exist.
  license: { name: MIT }

servers:
  - url: http://{host}:4141
    variables: { host: { default: 192.168.1.1 } }

security:
  - bearer: []
  - session: []

tags:
  - { name: auth, description: "browser login with the box's root account; pairing a controller" }
  - { name: agent, description: the box itself — liveness, identity, counters, log, live events }
  - { name: engines, description: nfqws2 / usque / xray }
  - { name: plane, description: "routing plane: the DPI / WARP / VLESS lists" }
  - { name: update, description: "new releases; the router updated from the panel" }
  - { name: dns, description: "protected DNS: DoH through the tunnels; substitution check" }

paths:
  /api/v1/healthz:
    get:
      tags: [agent]
      operationId: healthz
      summary: Liveness (no token)
      security: []
      responses:
        "200":
          description: alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: { status: { type: string, const: ok } }

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log a browser in with the box's root account
      description: >
        Checks the password against Entware's /opt/etc/shadow (AUTH_USER /
        AUTH_FILES in nuxk.conf) and sets the `nuxk_agent` session cookie
        (HttpOnly, SameSite=Strict; forgotten after 12 h unused or a restart
        of nuxk-core). After 5 failures from one address the next attempts
        wait, doubling up to 15 min.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Credentials" } } }
      responses:
        "200":
          description: logged in; Set-Cookie carries the session
          content: { application/json: { schema: { $ref: "#/components/schemas/SessionInfo" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the browser session
      security: []
      responses:
        "200":
          description: the session is gone, the cookie cleared
          content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } }

  /api/v1/auth/pair:
    post:
      tags: [auth]
      operationId: pair
      summary: Hand the API token to a controller that knows the root password
      description: >
        nuxk-controller's setup calls this once with the root login and
        password the person typed; it keeps the token, never the password.
        Same lockout as /auth/login.
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/Credentials" } } }
      responses:
        "200":
          description: the agent's API_TOKEN
          content: { application/json: { schema: { $ref: "#/components/schemas/PairInfo" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /api/v1/version:
    get:
      tags: [agent]
      operationId: version
      responses:
        "200":
          description: build
          content: { application/json: { schema: { $ref: "#/components/schemas/Version" } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/info:
    get:
      tags: [agent]
      operationId: info
      summary: What box this is (router or test stand), firmware, uptime
      responses:
        "200":
          description: node
          content: { application/json: { schema: { $ref: "#/components/schemas/NodeInfo" } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/status:
    get:
      tags: [agent]
      operationId: status
      summary: Whole platform state — every engine plus the routing plane
      description: Served from memory (the reconcile loop keeps it fresh); never blocks on an engine.
      responses:
        "200":
          description: snapshot
          content: { application/json: { schema: { $ref: "#/components/schemas/Status" } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/metrics:
    get:
      tags: [agent]
      operationId: metrics
      summary: Raw counters from /proc — rates are the reader's job
      responses:
        "200":
          description: counters
          content: { application/json: { schema: { $ref: "#/components/schemas/Metrics" } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/logs:
    get:
      tags: [agent]
      operationId: logs
      summary: The agent's recent log (last 500 entries kept in memory)
      parameters:
        - { name: after, in: query, description: only entries with a larger seq, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, description: "at most this many, newest (default 200, max 500)", schema: { type: integer, minimum: 1, maximum: 500 } }
      responses:
        "200":
          description: entries, oldest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/LogEntry" } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/events:
    get:
      tags: [agent]
      operationId: events
      summary: Live stream (Server-Sent Events)
      description: >
        `event: status` with a Status snapshot on connect and on every change;
        `event: log` with a LogEntry per new log line; a `: ping` comment every
        20 s. The stream stays open until the client goes away.
      responses:
        "200":
          description: text/event-stream
          content: { text/event-stream: { schema: { type: string } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/engines:
    get:
      tags: [engines]
      operationId: engines
      responses:
        "200":
          description: every wired engine
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EngineState" } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/engines/{kind}:
    get:
      tags: [engines]
      operationId: engine
      summary: One engine, read live (not from the snapshot)
      parameters: [{ $ref: "#/components/parameters/kind" }]
      responses:
        "200":
          description: live info
          content: { application/json: { schema: { $ref: "#/components/schemas/EngineInfo" } } }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/engines/{kind}/{action}:
    post:
      tags: [engines]
      operationId: engineAction
      summary: start | stop | restart | probe | apply
      description: >
        start/stop/restart also record the run intent (the controller keeps it
        with backoff). probe runs an active check now (nfqws2: its probe sites,
        see probe-targets), keeps it as the engine's last probe and returns it.
        apply takes a Routing body.
      parameters:
        - { $ref: "#/components/parameters/kind" }
        - { name: action, in: path, required: true, schema: { type: string, enum: [start, stop, restart, probe, apply] } }
      requestBody:
        required: false
        content: { application/json: { schema: { $ref: "#/components/schemas/Routing" } } }
      responses:
        "200":
          description: probe result
          content: { application/json: { schema: { $ref: "#/components/schemas/Probe" } } }
        "202":
          description: done
          content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/engines/{kind}/config:
    put:
      tags: [engines]
      operationId: engineConfig
      summary: Runtime config (xray only today); stored 0600, never served back
      description: >
        xray: exactly one of vless_uri (a vless:// link) or sub_url (a 3x-ui
        subscription; its first VLESS server). The agent renders config.json
        (TUN inbound opkgtunN → VLESS), xray tests it, and it replaces the old
        one; if xray won't start with it, the old one comes back (502). A link
        that can't work is 400 with the reason in words.
      parameters: [{ $ref: "#/components/parameters/kind" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EngineConfig" } } }
      responses:
        "200":
          description: applied; what the config now points at
          content: { application/json: { schema: { $ref: "#/components/schemas/Upstream" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/engines/{kind}/upstream:
    get:
      tags: [engines]
      operationId: engineUpstream
      summary: What the engine's config points at (xray) — no secrets
      description: >
        The servers of the link or subscription, the one in use, and what the
        subscription's panel reports (3x-ui: title, traffic, term, how often
        to re-read it). A subscription is re-read on the router every
        Profile-Update-Interval (12 h if unset, within 1–24 h); the same
        server with the same settings restarts nothing.
      parameters: [{ $ref: "#/components/parameters/kind" }]
      responses:
        "200":
          description: source "" = nothing set yet
          content: { application/json: { schema: { $ref: "#/components/schemas/Upstream" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/engines/{kind}/upstream/pick:
    post:
      tags: [engines]
      operationId: engineUpstreamPick
      summary: Switch to another server of the stored subscription
      parameters: [{ $ref: "#/components/parameters/kind" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [server]
              properties:
                server: { type: string, description: "an UpstreamServer key (name@host:port)" }
      responses:
        "200":
          description: applied
          content: { application/json: { schema: { $ref: "#/components/schemas/Upstream" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "the server is a link, not a subscription", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/engines/{kind}/upstream/refresh:
    post:
      tags: [engines]
      operationId: engineUpstreamRefresh
      summary: Re-read the stored subscription now
      description: A failure keeps the running config; its reason is in the stored Upstream's error.
      parameters: [{ $ref: "#/components/parameters/kind" }]
      responses:
        "200":
          description: re-read
          content: { application/json: { schema: { $ref: "#/components/schemas/Upstream" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { description: "nothing set yet", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/engines/{kind}/strategies:
    get:
      tags: [engines]
      operationId: engineStrategies
      summary: nuxk's per-domain strategies on this engine (nfqws2 only)
      parameters: [{ $ref: "#/components/parameters/kind" }]
      responses:
        "200":
          description: the stored set
          content: { application/json: { schema: { $ref: "#/components/schemas/StrategySet" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [engines]
      operationId: setEngineStrategies
      summary: Replace nuxk's strategies (an empty list removes them)
      description: >
        nfqws2: each strategy becomes its own profile in NFQWS_ARGS_CUSTOM
        (the stock script puts it before the others) with a hostlist
        nuxk-sN.list of its domains and a protocol filter. Only --payload,
        --lua-desync, --out-range and --in-range are accepted, without files;
        a leading "nfqws2" and --filter-*/--hostlist* are dropped. nfqws2
        restarts; the conf is copied to nfqws2.conf.nuxk-bak first (and the
        original once to .nuxk-orig). If nfqws2 won't start, the old conf is
        restored and the answer is 502. Custom args a person wrote there
        themselves are never overwritten (502 with the reason).
      parameters: [{ $ref: "#/components/parameters/kind" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StrategySet" } } }
      responses:
        "200":
          description: applied, nfqws2 running with them
          content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /api/v1/engines/{kind}/probe-targets:
    get:
      tags: [engines]
      operationId: engineProbeTargets
      summary: The sites the probe opens (nfqws2 only)
      description: >
        The person's own, or — when none — up to 5 picked from nfqws2's
        hostlist, leaving out what the router sends into a tunnel (the
        person's routed Keenetic lists, nuxk's applied WARP/VLESS groups).
      parameters: [{ $ref: "#/components/parameters/kind" }]
      responses:
        "200":
          description: the sites and whether nuxk chose them
          content: { application/json: { schema: { $ref: "#/components/schemas/ProbeSites" } } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [engines]
      operationId: setEngineProbeTargets
      summary: Set the probe's sites (an empty list = automatic)
      description: >
        Up to 10 site names; "https://site/path" is cut to the site. Each is
        opened over HTTPS from the router, in parallel, 8 s each.
      parameters: [{ $ref: "#/components/parameters/kind" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targets]
              properties:
                targets: { type: array, items: { type: string }, maxItems: 10 }
      responses:
        "200":
          description: what the probe uses from now on
          content: { application/json: { schema: { $ref: "#/components/schemas/ProbeSites" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/plane:
    get:
      tags: [plane]
      operationId: plane
      responses:
        "200":
          description: plane status
          content: { application/json: { schema: { $ref: "#/components/schemas/PlaneStatus" } } }
        "404": { description: "plane is off (PLANE= in nuxk.conf)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /api/v1/plane/lists:
    get:
      tags: [plane]
      operationId: planeLists
      responses:
        "200":
          description: desired lists
          content: { application/json: { schema: { $ref: "#/components/schemas/PlaneDesired" } } }
        "404": { $ref: "#/components/responses/Error" }
    put:
      tags: [plane]
      operationId: setPlaneLists
      summary: Replace every list and the tunnel-down policy; the plane reconciles right away
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PlaneDesired" } } }
      responses:
        "200":
          description: stored
          content: { application/json: { schema: { $ref: "#/components/schemas/Ok" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/plane/import:
    post:
      tags: [plane]
      operationId: planeImport
      summary: Copy the user's own routed Keenetic lists into a nuxk list
      description: The user's groups stay untouched; their domains are held back as conflicts until removed there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [groups, mode]
              properties:
                groups: { type: array, items: { type: string }, minItems: 1 }
                mode: { $ref: "#/components/schemas/ListMode" }
      responses:
        "200":
          description: the new desired lists
          content: { application/json: { schema: { $ref: "#/components/schemas/PlaneDesired" } } }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/update:
    get:
      tags: [update]
      operationId: update
      summary: This version, the newest release, the last update from the panel
      description: >
        The agent looks at the repository's releases on GitHub a couple of
        minutes after start and then once a day (settings.check). `run` is
        the last update started from the panel, as its script reported it —
        it outlives the agent's restart.
      responses:
        "200":
          description: the update state
          content: { application/json: { schema: { $ref: "#/components/schemas/UpdateStatus" } } }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [update]
      operationId: startUpdate
      summary: Update this router to the release found (the router's own `nuxk update`)
      description: >
        Answers at once; the update runs in the background: the release's
        files checked against its SHA256SUMS, whose signature this agent
        checks with the built-in release key; then the agent is restarted and
        asked whether it answers — if not, the previous version is put back.
        The agent is down for a few seconds on the way: follow `run` with GET.
        Only a version newer than this one, and only the one GET shows as
        `latest`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, example: 0.4.1 }
      responses:
        "202":
          description: started
          content: { application/json: { schema: { $ref: "#/components/schemas/UpdateStatus" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: "update_busy: one is running; update_stale: not the version found, or not newer"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503":
          description: "update_unavailable: no `nuxk` command here (not installed by nuxk-lite)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/update/check:
    post:
      tags: [update]
      operationId: checkUpdate
      summary: Look for a new release now
      description: At most once a minute goes to GitHub; more often answers with the last look.
      responses:
        "200":
          description: the update state after the look
          content: { application/json: { schema: { $ref: "#/components/schemas/UpdateStatus" } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/update/settings:
    put:
      tags: [update]
      operationId: setUpdateSettings
      summary: Daily check on or off, and the channel
      description: Turning the check on or changing the channel looks right away.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateSettings" } } }
      responses:
        "200":
          description: the update state with the new settings
          content: { application/json: { schema: { $ref: "#/components/schemas/UpdateStatus" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/dns:
    get:
      tags: [dns]
      operationId: dns
      summary: Protected DNS — on or off, which way the questions go, how each way does
      description: >
        A forwarder on the router (DNS_LISTEN; by default its LAN address,
        port 53053 — KeeneticOS refuses loopback DNS servers) that the
        router's DNS proxy asks once it's turned on: each query goes out as
        DNS-over-HTTPS through VLESS, then WARP, then straight — the
        provider can neither see nor substitute the answer. Answers are kept
        for their TTL (`settings.cache`): names in use are refreshed ahead of
        expiry, and while no way out answers (within 1.8 s) an answer that
        expired within a day goes back with a 30 s TTL. The DNS proxy (and
        its domain routing) stays.
      responses:
        "200":
          description: the state
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSStatus" } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/dns/settings:
    put:
      tags: [dns]
      operationId: setDNSSettings
      summary: Turn protected DNS on or off; the way out; the resolvers
      description: >
        Turning on changes the router's DNS settings: the forwarder must
        answer through some way out first, then it's added to the DNS proxy
        ("ip name-server <LAN address>:53053", running config only, never saved)
        and the router must still answer — otherwise it's taken back and
        nothing changed. Turning off takes it back. A field left out (or an
        empty `via`, `resolvers`) keeps what's set; turning off — protection
        or the cache — forgets the cache.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DNSSettings" } } }
      responses:
        "200":
          description: the state with the new settings
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSStatus" } } }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "409":
          description: "dns_unavailable: not a Keenetic (or the routing plane is off) — nothing to attach to"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "502":
          description: "dns_failed: no way out answered, the router refused, or it stopped answering (taken back)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }

  /api/v1/dns/cache/flush:
    post:
      tags: [dns]
      operationId: flushDNSCache
      summary: Forget the kept answers — the next questions go to the resolvers
      responses:
        "200":
          description: the state, the cache empty (its counters stay)
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSStatus" } } }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/dns/check:
    post:
      tags: [dns]
      operationId: checkDNS
      summary: Is DNS substituted — the router's answer and a plain resolver's against DoH through the tunnel
      description: >
        For a few registry-blocked canaries and the person's list domains
        (or the ones given, up to 20): the router's answer (what devices
        get), 8.8.8.8 asked plainly over the provider's network, and DoH
        through the tunnel as the reference. «spoofed» only on clear signs —
        «no such site» where it exists, a private address, one address for
        unrelated sites; other addresses alone are «differs» (CDNs).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                domains: { type: array, items: { type: string }, maxItems: 20 }
      responses:
        "200":
          description: the answers and verdicts
          content: { application/json: { schema: { $ref: "#/components/schemas/DNSCheck" } } }
        "401": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
    session: { type: apiKey, in: cookie, name: nuxk_agent }

  parameters:
    kind:
      name: kind
      in: path
      required: true
      schema: { $ref: "#/components/schemas/EngineKind" }

  responses:
    Error:
      description: error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Ok:
      type: object
      required: [status]
      properties: { status: { type: string } }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }

    Credentials:
      type: object
      required: [user, password]
      properties:
        user: { type: string, description: "root (AUTH_USER)" }
        password: { type: string, format: password }

    SessionInfo:
      type: object
      required: [user]
      properties:
        user: { type: string }

    PairInfo:
      type: object
      required: [token]
      properties:
        token: { type: string, description: the agent's API_TOKEN }

    Version:
      type: object
      required: [version, commit, api]
      properties:
        version: { type: string }
        commit: { type: string }
        api: { type: string, const: v1 }

    NodeInfo:
      type: object
      required: [role, hostname, arch, kernel, uptime_sec, core_since, version, commit]
      properties:
        role:
          type: string
          enum: [router, stand, host]
          description: "router = Keenetic; stand = Docker prototype on the Pi"
        hostname: { type: string }
        model: { type: string, description: Keenetic model (router only) }
        firmware: { type: string, description: KeeneticOS release (router only) }
        arch: { type: string }
        kernel: { type: string }
        uptime_sec: { type: integer, description: the box }
        core_since: { type: integer, description: unix seconds nuxk-core started }
        version: { type: string }
        commit: { type: string }

    Metrics:
      type: object
      required: [ts, ifaces, nfqueues, conntrack, conntrack_max, load1, mem_total_kb, mem_avail_kb, core_rss_kb]
      properties:
        ts: { type: integer, description: unix milliseconds }
        wan: { type: string, description: interface of the IPv4 default route }
        ifaces:
          type: object
          additionalProperties: { $ref: "#/components/schemas/IfaceCounters" }
        nfqueues: { type: array, items: { $ref: "#/components/schemas/NFQueue" } }
        conntrack: { type: integer }
        conntrack_max: { type: integer }
        load1: { type: number }
        mem_total_kb: { type: integer }
        mem_avail_kb: { type: integer }
        core_rss_kb: { type: integer }

    IfaceCounters:
      type: object
      required: [rx, tx]
      properties:
        rx: { type: integer, description: bytes received }
        tx: { type: integer, description: bytes sent }

    NFQueue:
      type: object
      required: [num, packets, dropped, waiting]
      properties:
        num: { type: integer }
        packets: { type: integer, description: packets through the queue since boot }
        dropped: { type: integer }
        waiting: { type: integer }

    LogEntry:
      type: object
      required: [seq, ts, level, msg]
      properties:
        seq: { type: integer }
        ts: { type: integer, description: unix milliseconds }
        level: { type: string, enum: [debug, info, warn, error] }
        msg: { type: string }
        attrs: { type: string }

    Status:
      type: object
      required: [version, ts, engines, plane]
      properties:
        version: { type: string }
        ts: { type: integer }
        engines: { type: array, items: { $ref: "#/components/schemas/EngineState" } }
        plane:
          description: PlaneStatus, or {"backend":"off"} when the plane is off
          oneOf:
            - $ref: "#/components/schemas/PlaneStatus"
            - $ref: "#/components/schemas/PlaneOff"

    PlaneOff:
      type: object
      required: [backend]
      properties: { backend: { type: string, const: "off" } }

    EngineKind: { type: string, enum: [nfqws2, usque, xray] }
    Health: { type: string, enum: [ok, degraded, down, unknown] }

    EngineInfo:
      type: object
      required: [kind, running, uptime_sec, health, routes]
      properties:
        kind: { $ref: "#/components/schemas/EngineKind" }
        running: { type: boolean }
        pid: { type: integer }
        uptime_sec: { type: integer }
        version: { type: string }
        health: { $ref: "#/components/schemas/Health" }
        iface: { type: string, description: "tunnel (opkgtun0) or, for nfqws2, the WAN it hooks" }
        endpoint: { type: string, description: upstream the tunnel dials }
        routes: { type: integer }
        detail: { type: object, additionalProperties: { type: string } }

    EngineState:
      description: EngineInfo plus the last probe and the controller's view
      allOf:
        - $ref: "#/components/schemas/EngineInfo"
        - type: object
          properties:
            probe: { $ref: "#/components/schemas/Probe" }
            probe_at: { type: integer }
            want_run: { type: boolean, description: "run intent: true keep running, false keep stopped, absent unmanaged" }
            last_error: { type: string }

    Probe:
      type: object
      required: [ok, ts]
      properties:
        ok: { type: boolean }
        egress_ip: { type: string }
        rtt_ms: { type: number }
        detail: { type: object, additionalProperties: { type: string } }
        reason: { type: string }
        ts: { type: integer }
        checks:
          type: array
          description: >
            nfqws2: one per probe site, in the order asked. ok is then "at
            least one site opens"; detail has opened and total.
          items: { $ref: "#/components/schemas/ProbeCheck" }

    ProbeCheck:
      type: object
      required: [domain, ok]
      properties:
        domain: { type: string }
        ok: { type: boolean }
        rtt_ms: { type: number }
        reason:
          type: string
          description: >
            where it broke — dns (no address), connect (no TCP), connect_timeout
            (TCP never answers: by IP), tls_timeout (TCP up, TLS silently
            dropped: by name), reset (reset during TLS: by name), cert (someone
            else's certificate), slow (no answer in time), error_N (curl exit N)

    Upstream:
      type: object
      required: [source, servers, active]
      properties:
        source: { type: string, enum: ["", link, subscription] }
        title: { type: string, description: "the subscription's Profile-Title" }
        servers: { type: array, items: { $ref: "#/components/schemas/UpstreamServer" } }
        active: { type: integer, description: index into servers }
        usage: { $ref: "#/components/schemas/UpstreamUsage" }
        fetched_at: { type: integer }
        refresh_s: { type: integer, description: "Profile-Update-Interval, seconds" }
        skipped: { type: integer, description: "vless:// links of the subscription that don't parse" }
        notice: { type: string }
        error: { type: string, description: "the last refresh failed: why" }

    UpstreamServer:
      type: object
      required: [key, name, address, security, network]
      properties:
        key: { type: string, description: "name@host:port — stable across refreshes" }
        name: { type: string }
        address: { type: string }
        security: { type: string }
        network: { type: string }
        flow: { type: string }

    UpstreamUsage:
      type: object
      required: [upload, download, total, expire]
      description: "3x-ui's subscription-userinfo: bytes; unix seconds; 0 = unlimited / never"
      properties:
        upload: { type: integer }
        download: { type: integer }
        total: { type: integer }
        expire: { type: integer }

    ProbeSites:
      type: object
      required: [targets, auto]
      properties:
        targets: { type: array, items: { type: string } }
        auto: { type: boolean, description: "true = picked by nuxk from the DPI list" }

    Routing:
      type: object
      properties:
        domains: { type: array, items: { type: string } }
        cidrs: { type: array, items: { type: string } }
        endpoints: { type: array, items: { type: string } }
        strategy: { type: string }

    Strategy:
      type: object
      required: [id, protocol, domains, args]
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9_.:-]{1,80}$" }
        protocol: { type: string, enum: [tls, http, quic] }
        domains: { type: array, items: { type: string }, minItems: 1, maxItems: 5000 }
        args:
          type: string
          maxLength: 2000
          description: nfqws2 desync args, e.g. "--payload=tls_client_hello --lua-desync=multisplit:pos=1"
        source: { type: string, description: 'where it was found, e.g. "gp:<run_id>"' }
        applied_at: { type: integer, format: int64, description: unix seconds, set by the agent }

    StrategySet:
      type: object
      required: [strategies]
      properties:
        strategies: { type: array, items: { $ref: "#/components/schemas/Strategy" } }

    EngineConfig:
      type: object
      description: engine-specific (xray — vless_uri or sub_url)
      additionalProperties: { type: string }

    ListMode:
      type: string
      enum: [desync, warp, vless]
      description: "desync = «DPI» (nfqws2, direct); warp = usque tunnel; vless = xray tunnel"

    OnDown:
      type: string
      enum: [direct, block]
      description: what WARP/VLESS lists do while their tunnel is down

    PlaneList:
      type: object
      required: [name, mode, domains]
      properties:
        name: { type: string }
        mode: { $ref: "#/components/schemas/ListMode" }
        domains: { type: array, items: { type: string }, minItems: 1 }
        source: { type: string, description: "manual | imported:<group> | preset:<id>" }

    PlaneDesired:
      type: object
      required: [lists]
      properties:
        lists: { type: array, items: { $ref: "#/components/schemas/PlaneList" } }
        on_down: { $ref: "#/components/schemas/OnDown" }
        manage_desync: { type: boolean, description: nuxk owns nfqws2's hostlist (set by the first DPI list) }

    PlaneGroup:
      type: object
      required: [name, mode, interface, block, domains]
      properties:
        name: { type: string }
        mode: { $ref: "#/components/schemas/ListMode" }
        interface: { type: string }
        block: { type: boolean }
        domains: { type: array, items: { type: string } }

    PlaneOp:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [create-group, add-domains, del-domains, add-route, del-route, delete-group, ensure-v6-deny] }
        group: { type: string }
        interface: { type: string }
        block: { type: boolean }
        domains: { type: array, items: { type: string } }
        groups: { type: array, items: { type: string } }

    PlaneConflict:
      type: object
      required: [domain, group, user_group]
      properties:
        domain: { type: string }
        group: { type: string }
        user_group: { type: string }

    PlaneForeign:
      type: object
      required: [group, interface, domains]
      properties:
        group: { type: string }
        description: { type: string }
        interface: { type: string }
        domains: { type: array, items: { type: string } }

    PlaneStatus:
      type: object
      required: [backend, apply, ifaces, on_down, groups, desync, desync_ok, desync_managed, lists, pending]
      properties:
        backend: { type: string }
        apply: { type: boolean, description: "PLANE_APPLY=1; false = plan only" }
        ifaces: { type: object, additionalProperties: { type: string } }
        on_down: { $ref: "#/components/schemas/OnDown" }
        groups: { type: [array, "null"], items: { $ref: "#/components/schemas/PlaneGroup" } }
        desync: { type: [array, "null"], items: { type: string } }
        desync_ok: { type: boolean }
        desync_managed: { type: boolean }
        lists: { type: [array, "null"], items: { $ref: "#/components/schemas/PlaneList" } }
        pending: { type: [array, "null"], items: { $ref: "#/components/schemas/PlaneOp" } }
        conflicts: { type: array, items: { $ref: "#/components/schemas/PlaneConflict" } }
        foreign: { type: array, items: { $ref: "#/components/schemas/PlaneForeign" } }
        warnings: { type: array, items: { type: string } }
        last_error: { type: string }
        checked_at: { type: integer }
        applied_at: { type: integer }

    UpdateSettings:
      type: object
      required: [check, channel]
      properties:
        check: { type: boolean, description: look for a new release once a day }
        channel: { type: string, enum: [stable, beta], description: "beta: pre-releases too" }

    UpdateRelease:
      type: object
      required: [version, url, published_at, prerelease]
      properties:
        version: { type: string }
        name: { type: string }
        notes: { type: string, description: "the release's text (its CHANGELOG section), Markdown, ≤16 KiB" }
        url: { type: string, description: the release on GitHub }
        published_at: { type: integer, description: unix seconds }
        prerelease: { type: boolean }

    UpdateRun:
      type: object
      required: [state, from, to, started_at, at, log]
      properties:
        state: { type: string, enum: [running, done, failed, rolled_back, interrupted] }
        from: { type: string }
        to: { type: string }
        message: { type: string }
        started_at: { type: integer }
        at: { type: integer, description: the script's last report }
        log: { type: array, items: { type: string }, description: "the last lines of the update's output" }

    UpdateStatus:
      type: object
      required: [current, settings, latest, available, can_apply, run]
      properties:
        current: { type: string }
        settings: { $ref: "#/components/schemas/UpdateSettings" }
        latest:
          oneOf: [{ $ref: "#/components/schemas/UpdateRelease" }, { type: "null" }]
        available: { type: boolean, description: latest is newer than current }
        checked_at: { type: integer, description: "unix seconds; absent = not yet" }
        check_error: { type: string }
        can_apply: { type: boolean }
        cannot: { type: string, description: "why the panel can't update this box" }
        run:
          oneOf: [{ $ref: "#/components/schemas/UpdateRun" }, { type: "null" }]

    DNSSettings:
      type: object
      required: [enabled, via, resolvers, cache]
      properties:
        enabled: { type: boolean, description: the router's DNS proxy asks nuxk }
        via: { type: string, enum: [auto, vless, warp, direct], description: "auto: VLESS, then WARP, then straight; a tunnel falls back to straight while it's down" }
        resolvers: { type: array, items: { type: string }, description: "catalog ids, in order of preference" }
        cache: { type: boolean, description: "answers kept for their TTL (on unless turned off)" }

    DNSResolver:
      type: object
      required: [id, name, url]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string }

    DNSPathStat:
      type: object
      required: [name, up, ok, failed]
      properties:
        name: { type: string, enum: [vless, warp, direct] }
        iface: { type: string }
        up: { type: boolean, description: "usable now (a tunnel: its engine runs and its interface exists)" }
        ok: { type: integer }
        failed: { type: integer }
        last_ok: { type: integer }
        rtt_ms: { type: number }
        last_error: { type: string }

    DNSCache:
      type: object
      required: [entries, bytes, hits, misses, stale, refreshed]
      properties:
        entries: { type: integer }
        bytes: { type: integer, description: "memory taken, roughly; 2 MB and 5000 answers at most" }
        hits: { type: integer, description: answered from the cache }
        misses: { type: integer, description: "not there (or expired): asked the resolvers" }
        stale: { type: integer, description: "an expired answer handed back: no way out answered in time" }
        refreshed: { type: integer, description: names in use refreshed ahead of expiry }

    DNSStatus:
      type: object
      required: [settings, listen, running, attached, suspended, can_attach, queries, failed, consulted, paths, cache, catalog]
      properties:
        settings: { $ref: "#/components/schemas/DNSSettings" }
        listen: { type: string }
        running: { type: boolean, description: the forwarder listens }
        attached: { type: boolean, description: "added to the router's DNS proxy" }
        suspended: { type: boolean, description: "taken back for a while: no way out answered three checks running (30 s apart)" }
        can_attach: { type: boolean }
        cannot: { type: string }
        queries: { type: integer }
        failed: { type: integer }
        last_query: { type: integer, description: "the DNS proxy last asked, unix seconds" }
        consulted: { type: boolean, description: "the DNS proxy passed nuxk's own test question on" }
        last_path: { type: string }
        resolver: { type: string, description: the resolver that answered last }
        paths: { type: array, items: { $ref: "#/components/schemas/DNSPathStat" } }
        cache: { $ref: "#/components/schemas/DNSCache" }
        error: { type: string }
        catalog: { type: array, items: { $ref: "#/components/schemas/DNSResolver" } }

    DNSCheckItem:
      type: object
      required: [domain, truth, router, router_verdict, plain, plain_verdict]
      properties:
        domain: { type: string }
        truth: { type: array, items: { type: string }, description: "DoH through the tunnel: the reference" }
        router: { type: array, items: { type: string } }
        router_verdict: { type: string, enum: [ok, spoofed, differs, error] }
        router_note: { type: string }
        plain: { type: array, items: { type: string }, description: "8.8.8.8 asked plainly, over the provider's network" }
        plain_verdict: { type: string, enum: [ok, spoofed, differs, error] }
        plain_note: { type: string }

    DNSCheck:
      type: object
      required: [at, path, items, router_spoofed, plain_spoofed]
      properties:
        at: { type: integer }
        path: { type: string, description: "how the reference came: vless | warp | direct" }
        items: { type: array, items: { $ref: "#/components/schemas/DNSCheckItem" } }
        router_spoofed: { type: integer, description: domains the router answered with a stub }
        plain_spoofed: { type: integer, description: "domains plain DNS answered with a stub: the provider intercepts" }
